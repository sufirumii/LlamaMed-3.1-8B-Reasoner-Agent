<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LlamaMed-3.1-8B Reasoner Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">L</div>
          <div class="brand-text">
            <div class="brand-name">LlamaMed</div>
            <div class="brand-sub">3.1-8B Reasoner</div>
          </div>
        </div>
        <button class="icon-btn" id="collapse-sidebar" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <button class="new-chat-btn" id="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <div class="chat-list" id="chat-list"></div>
    </aside>
    <!-- Main -->
    <main class="main">
      <header class="main-header">
        <button class="icon-btn menu-toggle" id="open-sidebar" title="Open sidebar" aria-label="Open sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="session-title" id="session-title">New chat</div>
      </header>
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-column" id="chat-column"></div>
      </div>
      <div class="composer-wrap">
        <div class="composer">
          <div class="attachments" id="attachments"></div>
          <div class="composer-row">
            <label class="attach-btn" title="Attach PDF" aria-label="Attach PDF">
              <input type="file" id="file-input" accept="application/pdf" hidden />
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </label>
            <textarea id="composer-input" class="composer-input" placeholder="Ask about your documents…" rows="1"></textarea>
            <button class="send-btn" id="send-btn" title="Send (Enter)" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="legal-footer">Research tool only — not a substitute for clinical judgment.</footer>
  <script src="app.js"></script>
</body>
</html>
